[develop]
script_dir=$base/lib/ohm_localization
[install]
install_scripts=$base/lib/ohm_localization

[tool:pytest]
# A sourced ROS 2 puts its own pytest plugins on the entry-point path, and `launch_testing` of this
# distro is not written for the pytest in ~/.local: pytest then aborts before collecting a single test.
# Blocking the two ROS plugins makes `python3 -m pytest test -q` work in a sourced and an unsourced
# terminal alike.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright
          -p no:ament_pep257 -p no:ament_xmllint -p no:ament_flake8
